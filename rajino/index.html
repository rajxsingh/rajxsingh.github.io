<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Desk Companion (embedded)</title>
    <style>
      body { font-family: system-ui, sans-serif; background:#111; color:#eee; padding:20px }
      .pet { max-width:680px; margin:auto }
      .entry { border:1px solid #444; padding:10px; margin:10px 0; border-radius:8px }
    </style>
  </head>
  <body>
    <div class="pet">
      <h1>Desk Companion</h1>
      <div id="current">Loading...</div>
      <h2>Messages</h2>
      <div id="messages"></div>
    </div>

    <script>
      async function load() {
        try {
          const res = await fetch('/rajino/today.json');
          if (!res.ok) throw new Error('Failed to load');
          const data = await res.json();
          const workStart = data.config.work_start || '08:00';
          const workEnd = data.config.work_end || '18:00';
          const now = new Date();
          const [sh, sm] = (workStart || '08:00').split(':').map(Number);
          const [eh, em] = (workEnd || '18:00').split(':').map(Number);
          const nowMinutes = now.getHours() * 60 + now.getMinutes();
          const startMinutes = sh * 60 + sm;
          const endMinutes = eh * 60 + em;
          const isWorking = nowMinutes >= startMinutes && nowMinutes < endMinutes;
          const workingInfo = `<p><strong>Working hours:</strong> ${escapeHtml(workStart)} - ${escapeHtml(workEnd)}</p><p><strong>Schedule:</strong> ${escapeHtml(data.config.schedule_times)}</p>`;

          if (!isWorking) {
            document.getElementById('current').innerHTML = `${workingInfo}<p><strong>Task:</strong> ${escapeHtml(data.task.text)}</p><p><em>${escapeHtml(data.out_of_office_message)}</em></p>`;
            document.getElementById('messages').innerHTML = '';
            return;
          }

          const nowTime = now.getTime();
          const deliveredMessages = data.messages.filter((message) => {
            const messageTime = new Date(message.delivery_time).getTime();
            return !Number.isNaN(messageTime) && messageTime <= nowTime;
          });

          const currentMessage = deliveredMessages.length
            ? deliveredMessages.reduce((latest, message) => {
                const latestTime = new Date(latest.delivery_time).getTime();
                const messageTime = new Date(message.delivery_time).getTime();
                return messageTime > latestTime ? message : latest;
              }, deliveredMessages[0])
            : null;

          document.getElementById('current').innerHTML = `${workingInfo}<p><strong>Task:</strong> ${escapeHtml(data.task.text)}</p><p><strong>Current:</strong> ${escapeHtml(currentMessage ? currentMessage.text : 'No messages yet')}</p>`;

          const container = document.getElementById('messages');
          if (!data.messages.length) {
            container.innerHTML = '<p>No messages today.</p>';
          } else {
            container.innerHTML = data.messages.map(m => `<div class="entry"><p>${escapeHtml(m.text)}</p><small>${escapeHtml(m.delivery_time || m.date)}</small></div>`).join('');
          }
        } catch (e) {
          document.getElementById('current').innerText = 'Unable to load messages.';
          console.error(e);
        }
      }

      function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

      load();
    </script>
  </body>
</html>
